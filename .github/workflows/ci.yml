name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the release workflow run the same checks before publishing an image
  workflow_call:

# github.workflow is the caller's name when Release calls this, so the release
# checks and the regular CI run for the same push to main don't cancel each other
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          activate-environment: true
          cache-dependency-glob: requirements*.txt
      - run: uv pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install WeasyPrint system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          activate-environment: true
          cache-dependency-glob: requirements*.txt
      - run: uv pip install -r requirements-dev.txt
      - run: pytest -v

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: loadpilot:ci
          build-args: LOADPILOT_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Render a PDF inside the image
        run: >
          docker run --rm --entrypoint python loadpilot:ci -c
          "from weasyprint import HTML; assert HTML(string='<h1>ok</h1>').write_pdf().startswith(b'%PDF')"
      - name: Start container and check /health
        run: |
          docker run -d --name loadpilot -p 8000:8000 loadpilot:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs loadpilot
          exit 1
      - name: Run as a regular user, taking over a /config that older images left root-owned
        run: |
          trap 'docker logs upgraded 2>&1 | tail -30' ERR
          # Older images ran as root: fill a volume the way they left it (database, logs, secret key, a BOL)
          docker volume create old-config
          docker run --rm -v old-config:/config --entrypoint python loadpilot:ci -c "import asyncio, app; from loadpilot.config import BOL_DIR, DB_PATH; from loadpilot.database import DatabaseManager; asyncio.run(DatabaseManager(str(DB_PATH)).init_db()); (BOL_DIR / 'bol_1_abc123.pdf').write_bytes(b'%PDF-1.4')"
          docker run --rm -v old-config:/config --entrypoint find loadpilot:ci /config -user 0 | grep -q loadpilot.db

          docker run -d --name upgraded -p 8001:8000 -v old-config:/config loadpilot:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8001/health && break; sleep 1; done
          curl -fsS http://localhost:8001/health

          # The app runs as 1000:1000, everything in /config is now its own, and it can still save
          test "$(docker exec upgraded grep '^Uid:' /proc/1/status | cut -f2)" = 1000
          test "$(docker exec upgraded grep '^Gid:' /proc/1/status | cut -f2)" = 1000
          test -z "$(docker exec upgraded find /config ! -user 1000)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -d 'username=driver&password=correct-horse&confirm_password=correct-horse' http://localhost:8001/setup)" = 303

          # Invoices still render as that user, without font cache errors
          output=$(docker exec -u 1000:1000 -e HOME=/tmp upgraded python -c "from weasyprint import HTML; assert HTML(string='<h1>ok</h1>').write_pdf().startswith(b'%PDF')" 2>&1)
          echo "$output"
          if echo "$output" | grep -qi "error"; then exit 1; fi
