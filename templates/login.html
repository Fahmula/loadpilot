{% extends "auth_layout.html" %}

{% block title %}Sign In · LoadPilot{% endblock %}
{% block heading %}Welcome back{% endblock %}
{% block subheading %}Sign in to LoadPilot{% endblock %}

{% block form %}
<form method="post" action="/login" class="space-y-4">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="input input-lg w-full rounded-xl">
        {{ icon("user", "size-5 text-base-content/50") }}
        <input type="text" name="username" value="{{ username }}" placeholder="Username" autocomplete="username" autocapitalize="none" required autofocus>
    </label>
    <label class="input input-lg w-full rounded-xl">
        {{ icon("lock", "size-5 text-base-content/50") }}
        <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary btn-lg w-full rounded-2xl">
        {{ icon("log-in", "size-5") }} Sign In
    </button>
</form>
{% endblock %}
