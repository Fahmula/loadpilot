<!-- This is returned by FastAPI and injected into the page by HTMX -->
<form hx-post="/create-load-web/" hx-swap="none" id="saveLoadForm">
    <div class="row g-2 mb-3">
        <div class="col-12">
            <label class="small text-muted">Broker Name</label>
            <input type="text" name="broker_name" class="form-control" value="{{ data.broker_name or '' }}" required>
        </div>
        <div class="col-3">
            <label class="small text-muted">Rate ($)</label>
            <input type="number" step="0.01" name="rate_amount" class="form-control" value="{{ data.rate_amount or '' }}" required>
        </div>
        <div class="col-3">
            <label class="small text-muted">Loaded Mi</label>
            <input type="number" name="loaded_miles" class="form-control" value="{{ data.loaded_miles if data.loaded_miles is not none else 0 }}" required>
        </div>
        <div class="col-3">
            <label class="small text-muted">Load Ref #</label>
            <input type="text" name="load_reference" class="form-control" value="{{ data.load_reference or '' }}" required>
        </div>
        <div class="col-6">
            <label class="small text-muted">Pickup Loc: City, State</label>
            <input type="text" name="pickup_location" class="form-control" value="{{ data.pickup_location or '' }}" required>
        </div>
        <div class="col-6">
            <label class="small text-muted">Pickup Date</label>
            <input type="date" name="pickup_date" class="form-control" value="{{ data.pickup_date or '' }}" required>
        </div>
        <div class="col-6">
            <label class="small text-muted">Delivery Loc: City, State</label>
            <input type="text" name="delivery_location" class="form-control" value="{{ data.delivery_location or '' }}" required>
        </div>
        <div class="col-6">
            <label class="small text-muted">Delivery Date</label>
            <input type="date" name="delivery_date" class="form-control" value="{{ data.delivery_date or '' }}" required>
        </div>
        <div class="col-12">
            <label class="small text-muted">Notes</label>
            <textarea name="notes" class="form-control" rows="2">{{ data.notes or '' }}</textarea>
        </div>
    </div>
    <button type="submit" class="btn btn-success w-100 fw-bold">
        <i class="bi bi-check-circle"></i> Confirm & Save Load
    </button>
</form>
