{% extends "base.html" %}

{% block content %}
<h2 class="h4 mb-4 fw-bold">Company Settings</h2>

<form hx-post="/settings/save" hx-target="#save-result" class="pb-5">
    
    <!-- General Info Card -->
    <div class="card shadow-sm border-0 mb-3">
        <div class="card-body">
            <h6 class="card-title text-primary fw-bold mb-3"><i class="bi bi-building"></i> Company Info</h6>
            <div class="mb-3">
                <label class="form-label small text-muted">Company Name</label>
                <input type="text" name="company_name" class="form-control" value="{{ settings.company_name or '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label small text-muted">Street Address</label>
                <input type="text" name="street_address" class="form-control" value="{{ settings.street_address or '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label small text-muted">City, State ZIP</label>
                <input type="text" name="city_state_zip" class="form-control" value="{{ settings.city_state_zip or '' }}">
            </div>
            <div class="form-check form-switch mt-2">
                <input class="form-check-input" type="checkbox" name="show_address_on_invoice" value="true" {% if settings.show_address_on_invoice %}checked{% endif %}>
                <label class="form-check-label small">Show Address on Invoices</label>
            </div>
        </div>
    </div>

    <!-- AI Services Card -->
    <div class="card shadow-sm border-0 mb-3">
        <div class="card-body">
            <h6 class="card-title text-success fw-bold mb-3"><i class="bi bi-cpu"></i> Gemini AI Configuration</h6>
            <div class="mb-3">
                <label class="form-label small text-muted">Gemini API Key</label>
                <input type="password" name="gemini_api_key" class="form-control" placeholder="••••••••••••••••">
                <div class="form-text small text-muted">Paste your Google GenAI API key to automate parsing of Rate Confirmations.</div>
            </div>
        </div>
    </div>

    <!-- Banking Info Card -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <h6 class="card-title text-primary fw-bold mb-3"><i class="bi bi-bank"></i> Banking Info (Optional)</h6>
            <div class="mb-3">
                <label class="form-label small text-muted">Bank Name</label>
                <input type="text" name="bank_name" class="form-control" value="{{ settings.bank_name or '' }}">
            </div>
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label small text-muted">Account #</label>
                    <input type="text" name="account_number" class="form-control" value="{{ settings.account_number or '' }}">
                </div>
                <div class="col-6">
                    <label class="form-label small text-muted">Routing #</label>
                    <input type="text" name="routing_number" class="form-control" value="{{ settings.routing_number or '' }}">
                </div>
            </div>
            <div class="form-check form-switch mt-2">
                <input class="form-check-input" type="checkbox" name="show_bank_on_invoice" value="true" {% if settings.show_bank_on_invoice %}checked{% endif %}>
                <label class="form-check-label small">Include Direct Deposit info on Invoices</label>
            </div>
        </div>
    </div>

    <div id="save-result"></div> <!-- HTMX success message injection area -->

    <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm mb-4">
        <i class="bi bi-save"></i> Save Settings
    </button>
</form>

<!-- Account Card -->
<div class="card shadow-sm border-0 mb-5">
    <div class="card-body">
        <h6 class="card-title text-primary fw-bold mb-3">
            <i class="bi bi-person-lock"></i> Account
            <span class="text-muted fw-normal small ms-1">{{ request.state.user.username }}</span>
        </h6>
        <form hx-post="/settings/password" hx-target="#password-result" hx-on::after-request="if (event.detail.successful) this.reset()">
            <div class="mb-2">
                <label class="form-label small text-muted">Current Password</label>
                <input type="password" name="current_password" class="form-control" autocomplete="current-password" required>
            </div>
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label small text-muted">New Password</label>
                    <input type="password" name="new_password" class="form-control" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="col-6">
                    <label class="form-label small text-muted">Confirm</label>
                    <input type="password" name="confirm_password" class="form-control" autocomplete="new-password" minlength="8" required>
                </div>
            </div>
            <button type="submit" class="btn btn-outline-primary w-100 fw-bold">
                <i class="bi bi-key"></i> Change Password
            </button>
            <div id="password-result"></div>
        </form>
        <form method="post" action="/logout" class="mt-3">
            <button type="submit" class="btn btn-outline-danger w-100 fw-bold">
                <i class="bi bi-box-arrow-right"></i> Log Out
            </button>
        </form>
    </div>
</div>
{% endblock %}
