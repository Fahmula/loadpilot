{% extends "base.html" %}

{% block nav %}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-sm-8 col-md-5">
        <div class="text-center mb-4">
            <img src="/static/icon-192.png" alt="" width="64" height="64" class="rounded-3 shadow-sm mb-3">
            <h1 class="h4 fw-bold">Welcome to LoadPilot</h1>
            <p class="text-muted small">Create the account you'll use to sign in. This page only works once.</p>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger small py-2">{{ error }}</div>
                {% endif %}
                <form method="post" action="/setup">
                    <div class="mb-3">
                        <label class="form-label small text-muted">Username</label>
                        <input type="text" name="username" class="form-control" value="{{ username }}" autocomplete="username" autocapitalize="none" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Password</label>
                        <input type="password" name="password" class="form-control" autocomplete="new-password" minlength="8" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" autocomplete="new-password" minlength="8" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">
                        <i class="bi bi-person-check"></i> Create Account
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
