{% extends "auth_layout.html" %}

{% block title %}Welcome · LoadPilot{% endblock %}
{% block heading %}Welcome to LoadPilot{% endblock %}
{% block subheading %}Create the account you'll sign in with. This page only works once.{% endblock %}

{% block form %}
<form method="post" action="/setup" class="space-y-4">
    <label class="input input-lg w-full rounded-xl">
        {{ icon("user", "size-5 text-base-content/50") }}
        <input type="text" name="username" value="{{ username }}" placeholder="Username" autocomplete="username" autocapitalize="none" required autofocus>
    </label>
    <label class="input input-lg w-full rounded-xl">
        {{ icon("lock", "size-5 text-base-content/50") }}
        <input type="password" name="password" placeholder="Password (8+ characters)" autocomplete="new-password" minlength="8" required>
    </label>
    <label class="input input-lg w-full rounded-xl">
        {{ icon("lock", "size-5 text-base-content/50") }}
        <input type="password" name="confirm_password" placeholder="Confirm password" autocomplete="new-password" minlength="8" required>
    </label>
    <button type="submit" class="btn btn-primary btn-lg w-full rounded-2xl">
        {{ icon("user-plus", "size-5") }} Create Account
    </button>
</form>
{% endblock %}
