{% extends "base.html" %}

{% block title %}Loads · LoadPilot{% endblock %}

{% block content %}
<header class="mb-5 flex items-center justify-between gap-3">
    <h1 class="text-3xl font-bold tracking-tight">Loads</h1>
    <a href="/loads/new" class="btn btn-primary rounded-xl shadow-md shadow-primary/25">{{ icon("plus", "size-5") }} Add Load</a>
</header>

<label class="input input-lg mb-4 w-full rounded-2xl border-base-300/70 bg-base-100 text-base shadow-sm">
    {{ icon("search", "size-5 text-base-content/50") }}
    <input type="search" name="search" value="{{ search }}" placeholder="Search by broker, reference, location..."
           hx-get="/loads" hx-trigger="input changed delay:300ms, search" hx-target="#loads-results"
           hx-include="#status-filter" hx-push-url="true" hx-indicator="#search-spinner" autocomplete="off">
    <span id="search-spinner" class="htmx-indicator loading loading-spinner loading-sm text-primary"></span>
</label>

<div id="loads-results">
    {% include "partials/loads_results.html" %}
</div>
{% endblock %}
