{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h4 mb-0 fw-bold">All Loads</h2>
</div>

<!-- Search Input Form Card -->
<div class="card shadow-sm border-0 mb-3">
    <div class="card-body p-2">
        <div class="input-group">
            <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" 
                   name="search" 
                   class="form-control border-0 shadow-none text-dark" 
                   placeholder="Search by Broker, Ref, Location..."
                   value="{{ search }}"
                   hx-get="/loads" 
                   hx-trigger="keyup changed delay:300ms" 
                   hx-target="#loads-list-wrapper"
                   hx-indicator="#search-spinner">
        </div>
    </div>
</div>

<!-- Inline Loading Indicator -->
<div id="search-spinner" class="htmx-indicator text-center my-3">
    <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
    <span class="ms-2 text-muted small">Searching database...</span>
</div>

<!-- Loads List Container -->
<div class="card shadow-sm border-0">
    <div class="card-body p-0" id="loads-list-wrapper">
        {% include "partials/loads_list.html" %}
    </div>
</div>

<style>
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: block; }
    .htmx-request.htmx-indicator { display: block; }
</style>
{% endblock %}
