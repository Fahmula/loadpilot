# Tool configuration only; the app is deployed as a Docker image, not a package.
[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "B008",  # FastAPI's File(...)/Form(...) defaults are the intended idiom
    "S104",  # binding 0.0.0.0 is intended inside the container
    "S608",  # SQL is built from whitelisted column names only (see UPDATABLE_COLUMNS)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
