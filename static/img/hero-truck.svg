<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 140 460 260" preserveAspectRatio="xMaxYMax slice">
  <!-- Header art: a semi on the highway at sunset, drawn for LoadPilot. Cropped to the rig (viewBox) and
       anchored bottom-right, so pages keep their titles on the left over the trailer. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b111c"/>
      <stop offset="0.24" stop-color="#18213a"/>
      <stop offset="0.42" stop-color="#4a3048"/>
      <stop offset="0.56" stop-color="#a24c2c"/>
      <stop offset="0.66" stop-color="#e9842b"/>
      <stop offset="0.73" stop-color="#ffc25c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#f08a24" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f08a24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1c9"/>
      <stop offset="0.55" stop-color="#ffc861"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1820"/>
      <stop offset="0.4" stop-color="#0e121b"/>
      <stop offset="1" stop-color="#0b111c"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2526"/>
      <stop offset="1" stop-color="#141925"/>
    </linearGradient>
    <linearGradient id="trailer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4054"/>
      <stop offset="0.5" stop-color="#1e2433"/>
      <stop offset="1" stop-color="#10151f"/>
    </linearGradient>
    <linearGradient id="trailerSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb04a" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#f6a23a" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#f6a23a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4152"/>
      <stop offset="1" stop-color="#11151f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#6b4a3a"/>
      <stop offset="1" stop-color="#1b2232"/>
    </linearGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe6ad" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffe6ad" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ffe3a3"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky, stars and the setting sun -->
  <rect width="600" height="400" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="260" cy="40" r="0.9" opacity="0.5"/>
    <circle cx="340" cy="78" r="0.7" opacity="0.35"/>
    <circle cx="430" cy="30" r="1" opacity="0.45"/>
    <circle cx="505" cy="92" r="0.7" opacity="0.3"/>
    <circle cx="560" cy="48" r="0.9" opacity="0.4"/>
    <circle cx="390" cy="128" r="0.6" opacity="0.25"/>
    <circle cx="210" cy="104" r="0.6" opacity="0.3"/>
  </g>
  <ellipse cx="330" cy="262" rx="380" ry="190" fill="url(#glow)"/>
  <circle cx="330" cy="246" r="34" fill="url(#sun)"/>

  <!-- Hills on the horizon -->
  <path d="M0 290 C40 280 70 276 110 282 C150 288 170 280 215 284 C260 288 300 272 350 274 C400 276 430 284 480 278 C530 272 570 276 600 282 L600 300 L0 300 Z" fill="#2b2230" opacity="0.9"/>
  <path d="M0 296 C60 290 120 294 170 292 C240 289 300 296 380 292 C450 288 530 294 600 291 L600 304 L0 304 Z" fill="#1d1a24"/>

  <!-- Ground and highway -->
  <rect y="300" width="600" height="100" fill="url(#ground)"/>
  <rect y="318" width="600" height="46" fill="url(#road)"/>
  <rect y="318" width="600" height="1.5" fill="#f6a23a" opacity="0.45"/>
  <rect y="363" width="600" height="1.2" fill="#f6a23a" opacity="0.18"/>
  <g fill="#f3c56b" opacity="0.55">
    <rect x="-10" y="340" width="34" height="2.4" rx="1.2"/>
    <rect x="60" y="340" width="34" height="2.4" rx="1.2"/>
    <rect x="130" y="340" width="34" height="2.4" rx="1.2"/>
    <rect x="200" y="340" width="34" height="2.4" rx="1.2"/>
    <rect x="270" y="340" width="34" height="2.4" rx="1.2"/>
    <rect x="340" y="340" width="34" height="2.4" rx="1.2"/>
    <rect x="410" y="340" width="34" height="2.4" rx="1.2"/>
    <rect x="480" y="340" width="34" height="2.4" rx="1.2"/>
    <rect x="550" y="340" width="34" height="2.4" rx="1.2"/>
  </g>

  <!-- The rig, drawn facing left and mirrored so the cab sits on the right, clear of page titles -->
  <g transform="matrix(-1 0 0 1 804 0)">
    <!-- Headlight beam and its glow on the road -->
    <path d="M236 297 L96 282 L96 334 L236 304 Z" fill="url(#beam)"/>
    <ellipse cx="160" cy="350" rx="70" ry="5" fill="#ffb347" opacity="0.07"/>

    <!-- Shadow under the rig -->
    <ellipse cx="410" cy="356" rx="190" ry="7" fill="#000000" opacity="0.45"/>

    <!-- Trailer -->
    <rect x="326" y="236" width="268" height="84" rx="3" fill="url(#trailer)"/>
    <rect x="326" y="236" width="268" height="84" rx="3" fill="url(#trailerSheen)"/>
    <g stroke="#0b0f17" stroke-width="1" opacity="0.6">
      <path d="M360 240v76M394 240v76M428 240v76M462 240v76M496 240v76M530 240v76M564 240v76"/>
    </g>
    <rect x="326" y="236" width="268" height="1.6" fill="#ffc56b" opacity="0.8"/>
    <rect x="326" y="316" width="268" height="7" fill="#0a0d14"/>
    <rect x="516" y="323" width="76" height="8" fill="#0a0d14"/>
    <rect x="376" y="323" width="4" height="22" fill="#0a0d14"/>
    <rect x="371" y="343" width="14" height="3" fill="#0a0d14"/>
    <g fill="#ffb347">
      <circle cx="340" cy="241.5" r="1.4"/>
      <circle cx="580" cy="241.5" r="1.4"/>
    </g>
    <rect x="589" y="300" width="4" height="10" rx="1" fill="#ff4d4d"/>

    <!-- Tractor: frame, sleeper, cab and hood -->
    <rect x="234" y="314" width="190" height="14" rx="3" fill="#0a0d14"/>
    <path d="M232 334 L232 318 L238 315 L238 283 Q239 277 247 276 L289 270 L301 241 Q303 235 311 235 L321 235 L321 234 Q321 230 325 230 L332 230 Q334 230 334 233 L334 322 L232 322 Z" fill="url(#cab)"/>
    <!-- rim light from the sunset along the top edges -->
    <path d="M238 283 Q239 277 247 276 L289 270 L301 241 Q303 235 311 235 L321 235" fill="none" stroke="#ffc56b" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
    <path d="M325 230 L332 230" fill="none" stroke="#ffc56b" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
    <!-- windows -->
    <path d="M292 268 L302 244 Q303 241 306 241 L309 241 L309 268 Z" fill="url(#glass)"/>
    <path d="M313 241 L328 241 L328 262 L313 262 Z" fill="url(#glass)" opacity="0.75"/>
    <!-- door, grille, bumper and steps -->
    <path d="M311 268 L311 312 M289 272 L289 312" stroke="#05080d" stroke-width="1.2" opacity="0.7"/>
    <rect x="234" y="284" width="7" height="30" rx="1.5" fill="#3a4152"/>
    <g stroke="#1b2130" stroke-width="1">
      <path d="M235.5 288h4.5M235.5 293h4.5M235.5 298h4.5M235.5 303h4.5M235.5 308h4.5"/>
    </g>
    <rect x="229" y="316" width="12" height="13" rx="2" fill="#3a4152"/>
    <rect x="229" y="316" width="12" height="1.4" fill="#ffc56b" opacity="0.6"/>
    <!-- exhaust stack and air cleaner -->
    <rect x="334" y="206" width="4" height="96" rx="2" fill="#2f3647"/>
    <rect x="334" y="206" width="1.4" height="96" fill="#ffc56b" opacity="0.6"/>
    <!-- fuel tank -->
    <rect x="270" y="310" width="34" height="18" rx="9" fill="#262c3a"/>
    <rect x="274" y="311" width="26" height="1.6" rx="0.8" fill="#ffc56b" opacity="0.45"/>
    <!-- headlight -->
    <circle cx="240" cy="299" r="9" fill="url(#lamp)"/>
    <circle cx="240" cy="299" r="2.6" fill="#ffffff"/>
    <!-- amber marker lights on the cab roof -->
    <g fill="#ffb347">
      <circle cx="306" cy="236.5" r="1.2"/>
      <circle cx="311" cy="235.6" r="1.2"/>
      <circle cx="316" cy="235.6" r="1.2"/>
    </g>

    <!-- Wheels: steer, drive tandem and trailer tandem -->
    <g>
      <g fill="#05080d">
        <circle cx="262" cy="337" r="16"/>
        <circle cx="372" cy="337" r="16"/>
        <circle cx="406" cy="337" r="16"/>
        <circle cx="540" cy="337" r="16"/>
        <circle cx="574" cy="337" r="16"/>
      </g>
      <g fill="#2b3242" stroke="#4a5368" stroke-width="1.2">
        <circle cx="262" cy="337" r="7"/>
        <circle cx="372" cy="337" r="7"/>
        <circle cx="406" cy="337" r="7"/>
        <circle cx="540" cy="337" r="7"/>
        <circle cx="574" cy="337" r="7"/>
      </g>
      <g fill="#8a93a6">
        <circle cx="262" cy="337" r="2"/>
        <circle cx="372" cy="337" r="2"/>
        <circle cx="406" cy="337" r="2"/>
        <circle cx="540" cy="337" r="2"/>
        <circle cx="574" cy="337" r="2"/>
      </g>
      <g fill="none" stroke="#ffc56b" stroke-width="1.2" opacity="0.45">
        <path d="M249 329 A16 16 0 0 1 262 321"/>
        <path d="M359 329 A16 16 0 0 1 372 321"/>
        <path d="M393 329 A16 16 0 0 1 406 321"/>
        <path d="M527 329 A16 16 0 0 1 540 321"/>
        <path d="M561 329 A16 16 0 0 1 574 321"/>
      </g>
    </g>
    <!-- mud flaps -->
    <rect x="424" y="322" width="4" height="22" fill="#0a0d14"/>
    <rect x="590" y="322" width="4" height="22" fill="#0a0d14"/>
  </g>
</svg>
